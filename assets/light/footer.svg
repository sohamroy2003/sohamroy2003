<svg viewBox="0 0 1000 196" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Current AI and data focus">
<style>
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,Liberation Mono,monospace}
@keyframes blink{0%,45%{opacity:1}50%,95%{opacity:.15}100%{opacity:1}}@keyframes drift{0%{stroke-dashoffset:0}100%{stroke-dashoffset:-36}}@keyframes glow{0%,100%{opacity:.35}50%{opacity:1}}
.cursor{animation:blink 1.1s steps(1,end) infinite}.signal{stroke-dasharray:5 7;animation:drift 1.6s linear infinite}.status{animation:glow 1.7s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="1000" height="196" fill="#ffffff"/><line x1="48" y1="42" x2="952" y2="42" stroke="#d0d7de"/><line class="signal" x1="48" y1="43" x2="952" y2="43" stroke="#0969da" opacity=".55"/>
<text class="mono" x="48" y="84" fill="#24292f" font-size="15">CURRENT SIGNAL</text><rect class="cursor" x="184" y="68" width="3" height="19" fill="#0969da"/>
<text class="mono" x="48" y="116" fill="#57606a" font-size="11.5">generative AI · retrieval systems · advanced ML · agentic workflows</text>
<text class="mono" x="48" y="166" fill="#6e7781" font-size="10" letter-spacing="2.3">STATUS</text><circle class="status" cx="125" cy="162" r="4" fill="#1a7f37"/><text class="mono" x="140" y="166" fill="#57606a" font-size="10">BUILDING / LEARNING / OPEN TO COLLABORATION</text><text class="mono" x="952" y="166" fill="#0969da" font-size="10.5" text-anchor="end">DATA → INSIGHTS → INTELLIGENCE</text>
</svg>