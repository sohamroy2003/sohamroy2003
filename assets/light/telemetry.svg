<svg viewBox="0 0 1000 326" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="GitHub telemetry for Soham Roy">
<style>
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,Liberation Mono,monospace}
@keyframes grow{0%{transform:scaleX(0)}100%{transform:scaleX(1)}}
@keyframes trace{0%{stroke-dashoffset:620}100%{stroke-dashoffset:0}}
@keyframes dot{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes sweep{0%{transform:translateX(-300px)}100%{transform:translateX(1050px)}}
.bar{transform-origin:left center;animation:grow 1s ease-out both}.b2{animation-delay:.12s}.b3{animation-delay:.24s}.b4{animation-delay:.36s}
.trace{stroke-dasharray:620;stroke-dashoffset:620;animation:trace 1.7s .25s ease-out forwards}.dot{animation:dot 1.5s ease-in-out infinite}.sweep{animation:sweep 5s 1.2s linear infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.trace{stroke-dasharray:none;stroke-dashoffset:0}}
</style>
<rect width="1000" height="326" fill="#ffffff"/>
<defs><linearGradient id="sw" x1="0" x2="1"><stop stop-color="#0969da" stop-opacity="0"/><stop offset=".5" stop-color="#0969da" stop-opacity=".3"/><stop offset="1" stop-color="#0969da" stop-opacity="0"/></linearGradient></defs>
<rect class="sweep" x="0" y="40" width="180" height="260" fill="url(#sw)" opacity=".16"/>
<line x1="48" y1="40" x2="952" y2="40" stroke="#d0d7de"/><text class="mono" x="48" y="27" fill="#57606a" font-size="10" letter-spacing="3">TELEMETRY — PROFILE SNAPSHOT / 08 SEP 2026</text><text class="mono" x="952" y="27" fill="#6e7781" font-size="10" letter-spacing="2" text-anchor="end">LIVE GRAPH BELOW</text>
<line x1="360" y1="66" x2="360" y2="300" stroke="#d0d7de" opacity=".6"/><line x1="690" y1="66" x2="690" y2="300" stroke="#d0d7de" opacity=".6"/>
<text class="mono" x="48" y="80" fill="#6e7781" font-size="9.5" letter-spacing="2">LANGUAGE SIGNAL</text>
