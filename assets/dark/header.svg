<svg viewBox="0 0 1000 400" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Soham Roy — Data Scientist, Data Analyst, AI and ML">
<style>
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,Liberation Mono,monospace}
@keyframes fadeUp{0%{opacity:0;transform:translateY(10px)}100%{opacity:1;transform:translateY(0)}}
@keyframes draw{0%{stroke-dashoffset:920}100%{stroke-dashoffset:0}}
@keyframes blink{0%,45%{opacity:1}50%,95%{opacity:.12}100%{opacity:1}}
@keyframes scan{0%{transform:translateX(-280px);opacity:0}15%{opacity:.28}50%{opacity:.16}85%{opacity:.28}100%{transform:translateX(1100px);opacity:0}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
.r1{animation:fadeUp .65s ease-out both}.r2{animation:fadeUp .7s .12s ease-out both}.r3{animation:fadeUp .7s .24s ease-out both}.r4{animation:fadeUp .7s .36s ease-out both}.r5{animation:fadeUp .7s .48s ease-out both}
.draw{stroke-dasharray:920;stroke-dashoffset:920;animation:draw 1.4s .08s ease-out forwards}
.scan{animation:scan 5.8s 1.2s linear infinite}.pulse{animation:pulse 2.4s ease-in-out infinite}.cursor{animation:blink 1.15s steps(1,end) infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.draw{stroke-dasharray:none;stroke-dashoffset:0}}
</style>
<rect width="1000" height="400" fill="#0d1117"/>
<defs><linearGradient id="scanG" x1="0" x2="1"><stop stop-color="#58a6ff" stop-opacity="0"/><stop offset=".5" stop-color="#58a6ff" stop-opacity=".7"/><stop offset="1" stop-color="#58a6ff" stop-opacity="0"/></linearGradient></defs>
<rect class="scan" x="0" y="54" width="220" height="284" fill="url(#scanG)" opacity=".12"/>
<line class="draw" x1="48" y1="54" x2="952" y2="54" stroke="#30363d"/>
<g class="r1"><text class="mono" x="48" y="39" fill="#8b949e" font-size="10.5" letter-spacing="3.2">PROFILE — DATA / AI INDEX Nº 001</text><text class="mono" x="952" y="39" fill="#8b949e" font-size="10.5" letter-spacing="3.2" text-anchor="end">BENGALURU, IN</text></g>
<g class="r2"><text class="mono" x="46" y="165" fill="#f0f6fc" font-size="69" letter-spacing="-2.4">Soham Roy</text><rect class="cursor" x="402" y="111" width="3" height="58" rx="1.5" fill="#58a6ff"/></g>
<g class="r3"><text class="mono" x="48" y="207" fill="#8b949e" font-size="18">Data Scientist · Data Analyst · AI / ML</text></g>
<g class="r4"><text class="mono" x="48" y="267" fill="#6e7681" font-size="12.5" letter-spacing="1">focus  ▸</text><text class="mono" x="128" y="267" fill="#58a6ff" font-size="12.5" letter-spacing=".8">analytics · machine learning · generative AI · RAG · intelligent systems</text></g>
<g class="r4"><text class="mono" x="48" y="297" fill="#8b949e" font-size="12">currently ▸ building with data, models, APIs and production AI workflows</text><circle class="pulse" cx="934" cy="293" r="4" fill="#3fb950"/></g>
<line class="draw" x1="48" y1="338" x2="952" y2="338" stroke="#30363d"/>
<g class="r5"><text class="mono" x="48" y="371" fill="#8b949e" font-size="10.5" letter-spacing="2.6">PYTHON · SQL · POWER BI</text><text class="mono" x="430" y="371" fill="#8b949e" font-size="10.5" letter-spacing="2.6">ML · LLM · RAG</text><text class="mono" x="952" y="371" fill="#8b949e" font-size="10.5" letter-spacing="2.6" text-anchor="end">@SOHAMROY2003</text></g>
</svg>