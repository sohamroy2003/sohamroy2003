<svg viewBox="0 0 1000 286" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Data and AI intelligence map">
<style>
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,Liberation Mono,monospace}
@keyframes nodeIn{0%{opacity:0;transform:translateY(8px)}100%{opacity:1;transform:translateY(0)}}
@keyframes dash{to{stroke-dashoffset:-34}}
@keyframes ping{0%,100%{r:3;opacity:.35}50%{r:6;opacity:1}}
.n1{animation:nodeIn .45s both}.n2{animation:nodeIn .45s .12s both}.n3{animation:nodeIn .45s .24s both}.n4{animation:nodeIn .45s .36s both}.n5{animation:nodeIn .45s .48s both}
.flow{stroke-dasharray:6 8;animation:dash 1.8s linear infinite}.ping{animation:ping 1.8s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="1000" height="286" fill="#0d1117"/>
<line x1="48" y1="38" x2="952" y2="38" stroke="#30363d"/><text class="mono" x="48" y="25" fill="#8b949e" font-size="10" letter-spacing="3">INTELLIGENCE MAP — FROM SIGNAL TO SYSTEM</text>
<line class="flow" x1="188" y1="170" x2="242" y2="100" stroke="#58a6ff"/><line class="flow" x1="378" y1="100" x2="432" y2="170" stroke="#58a6ff"/><line class="flow" x1="568" y1="170" x2="622" y2="100" stroke="#bc8cff"/><line class="flow" x1="758" y1="100" x2="812" y2="170" stroke="#bc8cff"/>
<g class="n1"><rect x="52" y="135" width="136" height="70" rx="2" fill="#161b22" stroke="#30363d"/><text class="mono" x="120" y="166" fill="#f0f6fc" font-size="12" text-anchor="middle" letter-spacing="1.4">RAW DATA</text><text class="mono" x="120" y="188" fill="#8b949e" font-size="9.5" text-anchor="middle">ingest · clean</text></g>
<g class="n2"><rect x="242" y="65" width="136" height="70" rx="2" fill="#161b22" stroke="#30363d"/><text class="mono" x="310" y="96" fill="#f0f6fc" font-size="12" text-anchor="middle" letter-spacing="1.4">ANALYTICS</text><text class="mono" x="310" y="118" fill="#8b949e" font-size="9.5" text-anchor="middle">EDA · BI</text></g>
<g class="n3"><rect x="432" y="135" width="136" height="70" rx="2" fill="#161b22" stroke="#30363d"/><text class="mono" x="500" y="166" fill="#f0f6fc" font-size="12" text-anchor="middle" letter-spacing="1.4">ML</text><text class="mono" x="500" y="188" fill="#8b949e" font-size="9.5" text-anchor="middle">train · evaluate</text></g>
<g class="n4"><rect x="622" y="65" width="136" height="70" rx="2" fill="#161b22" stroke="#30363d"/><text class="mono" x="690" y="96" fill="#f0f6fc" font-size="12" text-anchor="middle" letter-spacing="1.4">GEN AI</text><text class="mono" x="690" y="118" fill="#8b949e" font-size="9.5" text-anchor="middle">LLM · RAG</text></g>
<g class="n5"><rect x="812" y="135" width="136" height="70" rx="2" fill="#161b22" stroke="#30363d"/><text class="mono" x="880" y="166" fill="#f0f6fc" font-size="12" text-anchor="middle" letter-spacing="1.4">SYSTEMS</text><text class="mono" x="880" y="188" fill="#8b949e" font-size="9.5" text-anchor="middle">deploy · iterate</text></g>
<circle class="ping" cx="215" cy="135" r="4" fill="#58a6ff"/><circle class="ping" cx="405" cy="135" r="4" fill="#58a6ff" style="animation-delay:.3s"/><circle class="ping" cx="595" cy="135" r="4" fill="#bc8cff" style="animation-delay:.6s"/><circle class="ping" cx="785" cy="135" r="4" fill="#bc8cff" style="animation-delay:.9s"/>
<text class="mono" x="500" y="258" fill="#6e7681" font-size="10.5" text-anchor="middle" letter-spacing="2">DATA → INSIGHTS → MODELS → CONTEXT → INTELLIGENCE</text>
</svg>