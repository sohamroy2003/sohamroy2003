<svg viewBox="0 0 1000 356" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Technical stack">
<style>
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,Liberation Mono,monospace}
@keyframes reveal{0%{opacity:0;transform:translateX(-12px)}100%{opacity:1;transform:translateX(0)}}@keyframes line{0%{stroke-dashoffset:904}100%{stroke-dashoffset:0}}
.row{animation:reveal .6s ease-out both}.r2{animation-delay:.12s}.r3{animation-delay:.24s}.r4{animation-delay:.36s}.rule{stroke-dasharray:904;stroke-dashoffset:904;animation:line 1.2s ease-out forwards}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.rule{stroke-dasharray:none;stroke-dashoffset:0}}
</style>
<rect width="1000" height="356" fill="#0d1117"/><line class="rule" x1="48" y1="40" x2="952" y2="40" stroke="#30363d"/><text class="mono" x="48" y="27" fill="#8b949e" font-size="10" letter-spacing="3">STACK — TOOLS IN ACTIVE ROTATION</text>
<g class="row"><text class="mono" x="48" y="88" fill="#58a6ff" font-size="10" letter-spacing="2.4">DATA / ANALYTICS</text><text class="mono" x="250" y="88" fill="#f0f6fc" font-size="12">Python · SQL · Pandas · NumPy · Power BI · Matplotlib · Seaborn</text></g><line class="rule" x1="48" y1="110" x2="952" y2="110" stroke="#30363d" opacity=".55"/>
<g class="row r2"><text class="mono" x="48" y="154" fill="#58a6ff" font-size="10" letter-spacing="2.4">ML / AI</text><text class="mono" x="250" y="154" fill="#f0f6fc" font-size="12">Scikit-learn · TensorFlow · PyTorch · Generative AI · RAG · LLMs</text></g><line class="rule" x1="48" y1="176" x2="952" y2="176" stroke="#30363d" opacity=".55"/>
<g class="row r3"><text class="mono" x="48" y="220" fill="#6e7681" font-size="10" letter-spacing="2.4">DATABASES</text><text class="mono" x="250" y="220" fill="#f0f6fc" font-size="12">PostgreSQL · MySQL · MongoDB · Redis</text></g><line class="rule" x1="48" y1="242" x2="952" y2="242" stroke="#30363d" opacity=".55"/>
<g class="row r4"><text class="mono" x="48" y="286" fill="#6e7681" font-size="10" letter-spacing="2.4">ENGINEERING</text><text class="mono" x="250" y="286" fill="#f0f6fc" font-size="12">Git · Docker · AWS · Node.js · React · TypeScript</text></g><line class="rule" x1="48" y1="308" x2="952" y2="308" stroke="#30363d" opacity=".55"/>
